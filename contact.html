<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Sana Ansari</title>


    <style>

        /* =====================================================
           BASIC RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            color: #ffffff;

            background:

                radial-gradient(
                    circle at top left,
                    rgba(104, 76, 180, 0.35),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(0, 170, 180, 0.25),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #0b1020,
                    #151b35,
                    #10182d
                );

            background-attachment: fixed;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        header {

            width: 100%;

            padding: 22px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background:
                rgba(10, 15, 35, 0.75);

            backdrop-filter:
                blur(12px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);

            position: relative;

            z-index: 10;
        }


        /* LOGO */

        .logo h2 {

            font-size: 25px;

            letter-spacing: 1px;

            color: #ffffff;
        }


        .logo p {

            font-size: 13px;

            color: #aeb6d0;

            margin-top: 3px;
        }


        /* NAVIGATION */

        nav {

            display: flex;

            align-items: center;

            flex-wrap: wrap;
        }


        nav a {

            text-decoration: none;

            color: #d9dced;

            margin-left: 25px;

            font-size: 13px;

            font-weight: 500;

            transition: 0.3s;
        }


        nav a:hover {

            color: #c9a7ff;
        }


        nav a.active {

            color: #c9a7ff;
        }


        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .inner-page {

            width: 90%;

            max-width: 1100px;

            margin: auto;

            padding: 65px 0 80px;
        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title {

            text-align: center;

            margin-bottom: 50px;
        }


        .page-title h1 {

            font-size: 38px;

            letter-spacing: 3px;

            margin-bottom: 12px;

            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #c9a7ff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .page-title .line {

            width: 85px;

            height: 3px;

            margin:
                0 auto 14px;

            border-radius: 10px;

            background:

                linear-gradient(
                    90deg,
                    #a78bfa,
                    #5eead4
                );
        }


        .page-title p {

            color: #aeb6d0;

            font-size: 15px;
        }


        /* =====================================================
           CONTACT CONTAINER
        ===================================================== */

        .contact-container {

            display: grid;

            grid-template-columns:
                0.85fr 1.15fr;

            gap: 35px;

            padding: 40px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.13);

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.3);
        }


        /* =====================================================
           CONTACT INFORMATION
        ===================================================== */

        .contact-info {

            padding: 20px;
        }


        .contact-info h2 {

            font-size: 28px;

            margin-bottom: 15px;

            color: #ffffff;
        }


        .contact-info h2::after {

            content: "";

            display: block;

            width: 65px;

            height: 3px;

            margin-top: 10px;

            border-radius: 10px;

            background:

                linear-gradient(
                    90deg,
                    #a78bfa,
                    #5eead4
                );
        }


        .contact-info > p:first-of-type {

            color: #aeb6d0;

            line-height: 1.8;

            margin-top: 25px;

            margin-bottom: 30px;
        }


        .contact-info p:not(:first-of-type) {

            color: #d9dced;

            font-size: 15px;

            padding: 15px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            transition: 0.3s;
        }


        .contact-info p:not(:first-of-type):hover {

            color: #c9a7ff;

            transform:
                translateX(5px);
        }


        /* =====================================================
           FORM
        ===================================================== */

        form {

            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        form input,
        form textarea {

            width: 100%;

            padding: 15px 17px;

            border: 1px solid
                rgba(255,255,255,0.12);

            border-radius: 12px;

            outline: none;

            color: #ffffff;

            background:
                rgba(255,255,255,0.06);

            font-size: 14px;

            transition: 0.3s;
        }


        /* PLACEHOLDER */

        form input::placeholder,
        form textarea::placeholder {

            color: #8f97b2;
        }


        /* FOCUS */

        form input:focus,
        form textarea:focus {

            border-color:
                #a78bfa;

            background:
                rgba(167,139,250,0.08);

            box-shadow:
                0 0 15px
                rgba(167,139,250,0.12);
        }


        /* TEXTAREA */

        form textarea {

            resize: vertical;

            min-height: 150px;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .btn {

            border: none;

            cursor: pointer;

            padding: 14px 28px;

            border-radius: 30px;

            color: #ffffff;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 1px;

            background:

                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #14b8a6
                );

            box-shadow:

                0 8px 25px
                rgba(139,92,246,0.25);

            transition: 0.3s;
        }


        .btn:hover {

            transform:
                translateY(-4px);

            box-shadow:

                0 12px 30px
                rgba(139,92,246,0.4);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding: 22px;

            text-align: center;

            color: #8f97b2;

            font-size: 13px;

            border-top:
                1px solid
                rgba(255,255,255,0.1);

            background:
                rgba(5,10,25,0.5);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 850px) {

            header {

                flex-direction: column;

                gap: 18px;
            }


            nav {

                justify-content: center;
            }


            nav a {

                margin:
                    6px 10px;
            }


            .contact-container {

                grid-template-columns: 1fr;

                padding: 30px;
            }


            .contact-info {

                text-align: center;
            }


            .contact-info h2::after {

                margin-left: auto;

                margin-right: auto;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .logo {

                text-align: center;
            }


            nav a {

                font-size: 11px;

                margin:
                    5px 6px;
            }


            .inner-page {

                width: 92%;

                padding:
                    45px 0 60px;
            }


            .page-title h1 {

                font-size: 30px;
            }


            .contact-container {

                padding:
                    25px 18px;
            }


            .contact-info {

                padding: 10px;
            }


            .contact-info h2 {

                font-size: 24px;
            }


            form input,
            form textarea {

                font-size: 13px;

                padding:
                    13px 14px;
            }

        }

    </style>

</head>


<body>
